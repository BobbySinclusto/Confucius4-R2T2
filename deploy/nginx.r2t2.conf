# TLS front for the transcription server.
#
# Browsers only expose getUserMedia on a secure origin, so reaching the page as
# http://<lan-ip>:8272 from a phone means no microphone. This terminates TLS on
# :1443 and passes everything through to the Sanic app, which serves both the
# page and the ASR websocket.
#
# The certificate is the self-signed pair already used by the parent
# OpenLiveTranslate stack; a phone has to accept it once (Safari: "Show
# Details" → "visit this website").

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    access_log  /var/log/nginx/access.log;

    # A 30-minute talk is one websocket that must not be dropped by an idle
    # timeout: the mic keeps sending, but silence-only stretches are still
    # traffic, and the ASR side replies to each frame.
    send_timeout      3600s;
    keepalive_timeout 3600s;

    server {
        listen 1443 ssl;
        server_name _;

        ssl_certificate     /cert.pem;
        ssl_certificate_key /key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://r2t2-web:8272;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Websocket upgrade for /asr_stream_api_v1.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Live captioning: no buffering, no proxy-side cache, and never let
            # nginx sit on a partially-flushed response.
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no;

            proxy_connect_timeout 3600s;
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
        }
    }
}
